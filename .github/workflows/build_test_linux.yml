name: build_test_linux
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  build_test_linux:
    name: ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: ["ubuntu-latest"]
        python-version:
          [
            "pypy-3.11",
            "3.14",
            "3.13",
            "3.12",
            "3.11",
            "3.10",
            "3.9",
          ]

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: Setup py-${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          # Cache pip's own download and wheel cache, not the interpreter directory.
          # pip reuses wheels it built from source distributions, so the expensive
          # builds (pandas on PyPy) are still avoided.
          cache: pip
          cache-dependency-path: |
            dev_requirements.txt
            requirements.txt
            pyproject.toml
            setup.py
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install autoconf automake libtool pkg-config gettext libjson-c-dev
          sudo apt-get install libusb-1.0-0-dev libdbus-glib-1-dev libbluetooth-dev libnl-genl-3-dev flex bison

      - name: Install requirements
        run: |
          python -m pip install -r dev_requirements.txt

      - name: Build
        run: |
          python -m pip install .

      - name: Test
        if: startsWith(matrix.os, 'ubuntu') && !startsWith(matrix.python-version, '3.10')
        run: |
          python tests.py

      - name: Test and generate coverage report
        # On version 3.10, we test and generate coverage report.
        if: startsWith(matrix.python-version, '3.10')
        run: |
          python -m pip install coverage
          python -m coverage run tests.py
          python -m coverage combine

      - name: Upload coverage to Codecov
        if: startsWith(matrix.python-version, '3.10')
        uses: codecov/codecov-action@v1
