name: build_test_macos
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
# A newer commit on the same ref supersedes this run, so cancel the older one
# instead of letting both compete for runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_test_macos:
    name: ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: ["macos-latest"]
        python-version:
          [
            "pypy-3.11",
            "3.14",
            "3.13",
            "3.12",
            "3.11",
            "3.10",
            "3.9",
          ]

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: Setup py-${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          # Cache pip's own download and wheel cache, not the interpreter directory.
          # pip reuses wheels it built from source distributions, so the expensive
          # builds (pandas on PyPy) are still avoided.
          cache: pip
          cache-dependency-path: |
            dev_requirements.txt
            requirements.txt
            pyproject.toml
            setup.py
      - name: Installing prerequisites
        run: |
          brew install autoconf automake libtool pkg-config gettext json-c gcc

      - name: Install requirements
        run: |
          python -m pip install -r dev_requirements.txt

      - name: Build
        run: |
          python -m pip install .

      - name: Test
        # On other versions then 3.9, we test only. (without coverage generation)
        if: startsWith(matrix.os, 'macos') && !startsWith(matrix.python-version, '3.9') && !startsWith(github.ref, 'refs/tags/')
        run: |
          python tests.py

      - name: Test and generate coverage report
        # On version 3.9, we test and generate coverage report.
        if: startsWith(matrix.python-version, '3.9') && !startsWith(github.ref, 'refs/tags/')
        run: |
          python -m pip install coverage
          python -m coverage run tests.py
          python -m coverage combine

      - name: Upload coverage to Codecov
        if: startsWith(matrix.python-version, '3.9') && !startsWith(github.ref, 'refs/tags/')
        uses: codecov/codecov-action@v1
