name: build_test_windows
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
# A newer commit on the same ref supersedes this run, so cancel the older one
# instead of letting both compete for runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_test_windows:
    name: ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: ["windows-latest"]
        python-version:
          [
            "pypy-3.11",
            "3.14",
            "3.13",
            "3.12",
            "3.11",
            "3.9",
          ]

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: Setup py-${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          # Cache pip's own download and wheel cache, not the interpreter directory.
          # pip reuses wheels it built from source distributions, so the expensive
          # builds (pandas on PyPy) are still avoided.
          cache: pip
          cache-dependency-path: |
            dev_requirements.txt
            requirements.txt
            pyproject.toml
            setup.py

      - name: Setup msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: git unzip mingw-w64-x86_64-toolchain automake1.16 automake-wrapper autoconf libtool make mingw-w64-x86_64-json-c mingw-w64-x86_64-crt-git

      - name: Install requirements
        run: |
          python -m pip install -r dev_requirements.txt

      - name: Install NPCAP OEM
        env:
          NPCAP_OEM_USERNAME: ${{ secrets.NPCAP_OEM_USERNAME }}
          NPCAP_OEM_PASSWORD: ${{ secrets.NPCAP_OEM_PASSWORD }}
        run: |
          choco install wget --no-progress
          # npcap.com is periodically unreachable or refuses the TLS handshake. Retry, and
          # fail with an explicit message rather than letting Start-Process report a missing
          # file. -O keeps a failed attempt from being left behind under a .1 suffix.
          $installer = "npcap-1.60-oem.exe"
          $downloaded = $false
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            Remove-Item -Force -ErrorAction SilentlyContinue $installer
            wget --tries=3 --timeout=30 `
              "--user=$env:NPCAP_OEM_USERNAME" `
              "--password=$env:NPCAP_OEM_PASSWORD" `
              -O $installer https://npcap.com/oem/dist/npcap-1.60-oem.exe
            if ($LASTEXITCODE -eq 0) { $downloaded = $true; break }
            if ($attempt -lt 5) {
              Write-Host "Npcap OEM download attempt $attempt failed; retrying in 15 seconds"
              Start-Sleep -Seconds 15
            }
          }
          if (-not $downloaded) {
            Write-Error "ERROR: unable to download the Npcap OEM installer"
            exit 1
          }
          $process = Start-Process $installer `
            -ArgumentList "/loopback_support=yes /winpcap_mode=yes /dot11_support=yes /S" `
            -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            Write-Error "ERROR: Npcap installation failed with exit code $($process.ExitCode)"
            exit 1
          }
      - name: Build
        env:
          MSYSTEM: MINGW64
          MSYS2_PATH: D:/a/_temp/msys64
        run: |
          python -m pip install .

      - name: Test
        # On other versions then 3.9, we test only. (without coverage generation)
        if: startsWith(matrix.os, 'windows') && !startsWith(matrix.python-version, '3.9') && !startsWith(github.ref, 'refs/tags/') && !startsWith(matrix.python-version, 'pypy')
        run: |
          python tests.py

      - name: Test and generate coverage report
        # On version 3.9, we test and generate coverage report.
        if: startsWith(matrix.python-version, '3.9') && !startsWith(github.ref, 'refs/tags/') && !startsWith(matrix.python-version, 'pypy')
        run: |
          python -m pip install coverage
          python -m coverage run tests.py
          python -m coverage combine

      - name: Upload coverage to Codecov
        if: startsWith(matrix.python-version, '3.9') && !startsWith(github.ref, 'refs/tags/') && !startsWith(matrix.python-version, 'pypy')
        uses: codecov/codecov-action@v1
